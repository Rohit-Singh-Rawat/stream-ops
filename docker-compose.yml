services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stream_ops
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  db-migrate:
    image: oven/bun:1
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/stream_ops
    volumes:
      - ./:/repo
    working_dir: /repo
    command: sh -c "bun install && cd packages/db && bun install && bun run db:migrate"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      - postgres
      - db-migrate
    env_file:
      - ./apps/api/.env
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/stream_ops
    ports:
      - '4000:4000'

  worker:
    build:
      context: .
      dockerfile: services/worker/DockerFile
    depends_on:
      - postgres
      - db-migrate
    env_file:
      - ./services/worker/.env
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/stream_ops
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
      NEXT_PUBLIC_ASSET_BASE_URL: ${NEXT_PUBLIC_ASSET_BASE_URL}
    ports:
      - '3000:3000'

volumes:
  postgres_data: {}
