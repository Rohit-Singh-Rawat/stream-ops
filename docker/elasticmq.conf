# ElasticMQ configuration for local development.
# Provides a local SQS-compatible queue so no AWS credentials are required.
# Docs: https://github.com/softwaremill/elasticmq

include classpath("application.conf")

node-address {
  protocol = http
  host = "*"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  # Expose the SQS URL using the container hostname so the SDK receives correct
  # queue URLs when it calls ListQueues or GetQueueUrl.
  sqs-limits = strict
}

queues {
  jobs {
    # Matches the production SQS queue (15 minutes). A transcode can take several
    # minutes for long videos; 60s caused redelivery and duplicate processing.
    defaultVisibilityTimeout = 900 seconds
    delay = 0 seconds
    # Max wait time for long-poll ReceiveMessage requests (WaitTimeSeconds in SDK).
    receiveMessageWait = 20 seconds
  }
}
